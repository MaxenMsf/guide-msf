<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ère de la peur</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/era_apocalypse.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../scripts/script.js"></script>
</head>
<body>
    <div id="header-container"></div>
    <video class="banner-apocalypse" src="../images/age_peur.mp4" autoplay loop muted playsinline></video>
    <div class="info">
        Pour l'instant, il n'y a que 2 légendaires qui sont sortis pour l'Ère de la peur.
        <div class="portraits-container">
            <div class="portrait-card"><img src="../portrait/Portrait_SilverSurferBreaker.png" alt="Surfer d'argent (briseur)"></div>
            <div class="portrait-card"><img src="../portrait/Portrait_ScorpionBreaker.png" alt="Scorpion (briseur)"></div>
        </div>
        Pour débloquer Surfer d'argent (briseur), il faut la Guerriers audacieux.
        <div class="chapters-container">
            <div class="portraits-container chapter-box">
                <h3>Surfer d'argent (briseur)</h3>
                <div class="characters chapter-portraits">
                    <div class="character"><img src="../portrait/Portrait_Eclipse.png" alt="Elsa Bloodstone"></div>
                    <div class="character"><img src="../portrait/Portrait_Speedball.png" alt="Speedball"></div>
                    <div class="character"><img src="../portrait/Portrait_NightThrasher.png" alt="Daimon Hellstrom"></div>
                    <div class="character"><img src="../portrait/Portrait_Daredevil.png" alt="Hellcat"></div>
                    <div class="character"><img src="../portrait/Portrait_JessicaJones.png" alt="Momie vivante"></div>
                </div>
            </div>
            Pour débloquer Scorpion (briseur), il faut les Incroyables Avengers et les Exalted X-Men.
            <div class="portraits-container chapter-box">
                <h3>Scorpion (briseur)</h3>
                <div class="characters chapter-portraits">
                    <div class="character"><img src="../portrait/Portrait_BladeMighty.png" alt="Blade (puissant)"></div>
                    <div class="character"><img src="../portrait/Portrait_SpiderWomanJulia.png" alt="Spider-woman (Julia)"></div>
                    <div class="character"><img src="../portrait/Portrait_RachelColeAlves.png" alt="Rachel Cole-Alves"></div>
                    <div class="character"><img src="../portrait/Portrait_SpiderMan.png" alt="Spider-Man"></div>
                    <div class="character"><img src="../portrait/Portrait_Hulk.png" alt="Hulk"></div>
                </div>
                <div class="characters chapter-portraits">
                    <div class="character"><img src="../portrait/Portrait_StormMighty.png" alt="Storm (puissante)"></div>
                    <div class="character"><img src="../portrait/Portrait_Angel.png" alt="Angel"></div>
                    <div class="character"><img src="../portrait/Portrait_Morph.png" alt="Morph"></div>
                    <div class="character"><img src="../portrait/Portrait_Jubilee.png" alt="Jubilee"></div>
                    <div class="character"><img src="../portrait/Portrait_Wolverine.png" alt="Wolverine"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-container" style="margin-top: auto;"></div>
</body>
</html>
